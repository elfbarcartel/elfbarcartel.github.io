<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Наявність · Elfbar Freiburg</title>
<script src="config.js"></script>
<script src="data.js"></script>
<style>
:root{--bg:#0a0a0b;--card:#151517;--line:#2a2620;--text:#f3ecd8;--muted:#9c9585;--gold:#e2b84f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:19px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);font:inherit;outline:0;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{padding:8px 14px;border-radius:20px;background:var(--card);color:var(--muted);border:0;font:inherit}
.tabs button.on{background:var(--gold);color:#000;font-weight:600}
.m{color:var(--gold);font-size:13px;font-weight:600;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;gap:10px}
.row.off span{color:var(--muted);text-decoration:line-through}
.sw{position:relative;width:48px;height:28px;flex:none;border:0;border-radius:14px;background:#1D9E75;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:23px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.no{background:#444441}.sw.no::after{left:3px}
.sw:disabled{opacity:.5}
.st{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;font-size:13px;background:#0f3d31;color:#bff0dd;opacity:0;transition:opacity .2s}
.st.on{opacity:1}.st.bad{background:#501313;color:#f7c1c1}
.lock{text-align:center;color:var(--muted);padding:60px 20px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="st" id="st"></div>
<script>
const key=new URLSearchParams(location.hash.slice(1)).get("k")||"";
const app=document.getElementById("app");
const CN={disposable:"Одноразки",liquid:"Рідини"};
let off=new Set(),cat="disposable",q="";
let tm;function msg(s,bad){const e=document.getElementById("st");e.textContent=s;e.className="st on"+(bad?" bad":"");clearTimeout(tm);tm=setTimeout(()=>e.className="st",1800)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function draw(){
  const ql=q.trim().toLowerCase();
  const cats=ql?Object.keys(CATALOG):[cat];
  let html=`<h1>Наявність смаків</h1><div class="sub">Вимкни смак, якого немає. Клієнти одразу перестануть його бачити.${SHOP_CONFIG.API_URL?"":" (демо: зберігається тільки на цьому телефоні)"}</div>
  <input id="q" placeholder="Пошук смаку або моделі" value="${esc(q)}">
  ${ql?"":`<div class="tabs">${Object.keys(CATALOG).map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${CN[c]}</button>`).join("")}</div>`}`;
  let any=false;
  for(const c of cats)for(const m of CATALOG[c]){
    const fl=m.flavors.filter(f=>!ql||f.name.toLowerCase().includes(ql)||m.name.toLowerCase().includes(ql));
    if(!fl.length)continue; any=true;
    html+=`<div class="m">${esc(m.name)}</div>`+fl.map(f=>{const on=!off.has(f.id);return `<div class="row ${on?"":"off"}"><span>${esc(f.name)}</span><button class="sw ${on?"":"no"}" data-f="${f.id}" aria-label="${on?"вимкнути":"увімкнути"}"></button></div>`}).join("");
  }
  if(!any)html+=`<div class="lock">Нічого не знайдено</div>`;
  app.innerHTML=html;
  const i=document.getElementById("q");i.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;draw();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.c){cat=b.dataset.c;draw();return}
  if(b.dataset.f){
    const id=b.dataset.f,on=off.has(id);
    b.disabled=true;
    try{const r=await Avail.set(id,on,key);if(!r||!r.ok)throw new Error(r&&r.error||"err");on?off.delete(id):off.add(id);draw();msg(on?"Увімкнено — клієнти бачать":"Вимкнено — у магазині сховано")}
    catch(err){b.disabled=false;msg(String(err.message)==="bad key"?"Неправильне посилання кур'єра":"Не збереглось, перевір інтернет",true)}
  }
});
if(SHOP_CONFIG.API_URL&&!key){app.innerHTML='<div class="lock">Потрібне посилання кур\'єра з ключем.</div>'}
else{app.innerHTML='<div class="lock">Завантаження…</div>';Avail.load().then(o=>{off=o;draw()})}
</script>
</body>
</html>
